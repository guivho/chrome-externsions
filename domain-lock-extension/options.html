<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Domain Lock Opties</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 450px; background: #f9f9f9; color: #333; }
    h2 { margin-top: 0; font-size: 1.2rem; }
    .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
    input[type="text"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 14px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0052a3; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; background: white; padding: 8px 12px; margin-bottom: 6px; border: 1px solid #ddd; border-radius: 4px; }
    .btn-del { background: #dc3545; padding: 4px 8px; font-size: 0.8rem; }
    .btn-del:hover { background: #bd2130; }
  </style>
</head>
<body>
  <h2>Beschermde Domeinen</h2>

  <div class="input-group">
    <input type="text" id="domainInput" placeholder="bijv. mail.google.com">
    <button id="addBtn">Toevoegen</button>
  </div>

  <ul id="domainList"></ul>

  <script src="options.js"></script>
</body>
</html>
